name: Build Focus Flow iOS (IPA) & Android (APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  #  iOS — unsigned IPA (no Apple certs required)
  # ────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyser
        run: flutter analyze --no-fatal-infos

      - name: Build iOS Release (no codesign)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --build-number=${{ github.run_number }}

      - name: Package .app into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FocusFlow.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-iOS-IPA-${{ github.run_number }}
          path: FocusFlow.ipa
          retention-days: 30

  # ────────────────────────────────────────────
  #  Android — release APK + AAB (split by ABI)
  # ────────────────────────────────────────────
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyser
        run: flutter analyze --no-fatal-infos

      # Build Release APK
      - name: Build Android Release APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --build-number=${{ github.run_number }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-Android-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
